version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pelayobot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pelayo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pelayo_secret}
      POSTGRES_DB: ${POSTGRES_DB:-pelayodb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pelayo_user} -d ${POSTGRES_DB:-pelayodb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - pelayonet

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pelayobot_backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-pelayo_user}:${POSTGRES_PASSWORD:-pelayo_secret}@postgres:5432/${POSTGRES_DB:-pelayodb}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pelayonet
    profiles:
      - full

volumes:
  postgres_data:
    driver: local

networks:
  pelayonet:
    driver: bridge
